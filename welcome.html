<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f5" />
    <meta name="description" content="Open FieldLens: plan a trip, talk to FieldLens, check conditions, or check RTS bus alerts." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/welcome.css" />
    <title>FieldLens — Choose an action</title>
  </head>
  <body>
    <main id="welcome-main" aria-labelledby="welcome-title">
      <h1 id="welcome-title" class="sr-only">FieldLens</h1>
      <div class="welcome-tiles">
        <a class="welcome-tile lime" href="/#overview">
          <span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="3"/><circle cx="19" cy="19" r="3"/><path d="M8 5h8a4 4 0 0 1 0 8H8a4 4 0 0 0 0 8h8"/></svg></span>
          <span class="tile-label">Plan a trip</span>
        </a>
        <a class="welcome-tile pink" href="/#voice-assistant">
          <span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></span>
          <span class="tile-label">Talk to FieldLens</span>
        </a>
        <a class="welcome-tile aqua" href="/#overview" aria-describedby="conditions-hint">
          <span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 14a4 4 0 0 1-1-8 6 6 0 0 1 11-1 4 4 0 1 1 3 9M7 17l-1 4m6-4-1 4m6-4-1 4"/></svg></span>
          <span class="tile-label">Check conditions</span>
        </a>
        <a class="welcome-tile gray" href="/#transit">
          <span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="17" rx="3"/><path d="M5 10h14M8 19v3m8-3v3M8 5h8"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg></span>
          <span class="tile-label">Bus alerts</span>
        </a>
      </div>
      <span id="conditions-hint" class="sr-only">Choose a journey first.</span>
    </main>
    <script type="module" src="/src/welcome.js"></script>
  </body>
</html>
