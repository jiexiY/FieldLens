<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8f3"><meta name="description" content="RealLens environmental context for your campus journey. Preparation, not navigation."><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Plan a trip · RealLens</title></head>
<body><div id="app"><a class="skip-link" href="#main">Skip to plan a trip</a><header class="app-header"><a class="brand" href="/welcome" aria-label="RealLens home"><img src="/favicon.svg" alt="" width="32" height="32">RealLens</a><nav aria-label="App navigation"><a href="/welcome">Home</a><a href="/settings">Settings</a></nav></header><main id="main" class="app-main" tabindex="-1"><div class="page-heading"><h1>Plan a trip</h1></div><form id="journey-form" class="panel" novalidate><fieldset><legend>Your campus journey</legend><div class="field-row"><div class="field"><label for="origin">Starting place</label><select id="origin" name="origin" required></select></div><div class="field"><label for="destination">Destination</label><select id="destination" name="destination" required></select></div></div><button type="button" id="swap" class="text-button">Swap places</button><div class="field"><label for="departure">Departure · Gainesville time (Eastern)</label><input id="departure" name="departure" type="datetime-local" required aria-describedby="departure-hint"><p id="departure-hint" class="micro">Choose a time within the next six days.</p></div><div class="field"><label for="duration">Estimated time outdoors</label><select id="duration" name="duration"></select></div></fieldset><p id="form-error" class="form-error" role="alert" hidden></p><div class="page-actions"><button class="button button-primary" type="submit">Check this trip’s conditions</button><button type="button" id="load-saved" class="button button-outline" hidden>Use saved places</button></div><p class="micro">Six-place pilot. Environmental context, not an accessible route or navigation.</p></form><div class="page-actions"><a href="/talk">Prefer to speak or type a request?</a></div></main><footer class="app-footer"><a href="/sources">Sources &amp; privacy</a><a href="/">About RealLens</a></footer><div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div></div><script type="module" src="/src/plan.js"></script></body></html>
